# One origin for the browser: the UI on /, the API and WebSocket on /api.
# "api" resolves to every replica of the service; nginx balances across them.
upstream api {
    server api:8000;
}

upstream web {
    server web:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Longer than two server heartbeats, so idle sockets are not cut.
        proxy_read_timeout 120s;
    }

    location /metrics {
        # Each replica exposes its own metrics; scrape them directly in production.
        return 404;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
    }
}
