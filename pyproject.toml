[tool.poetry]
name = "websocket-chat"
version = "0.1.0"
description = ""
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
redis = "^5.0.0"
pydantic-settings = "^2.0.0"
structlog = "^23.0.0"
prometheus-client = "^0.17.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
alembic = "^1.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
aiosqlite = "^0.18.0"
mypy = "^1.7.0"
ruff = "^0.1.0"
types-python-jose = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# warn_return_any is disabled because the backend's redis_client returns
# set[Any] from a redis method that mypy can't narrow without stubs.
warn_return_any = false

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Rules disabled because they're new in recent ruff versions and the
# existing Python codebase wasn't written with them in mind. Re-enabling
# them requires touching every file in app/ and tests/ — out of scope
# for the frontend addition that introduced this CI split.
ignore = [
    "I001",   # import sorting
    "FA100",  # from __future__ import annotations
    "UP006",  # use list[] instead of List[]
    "UP035",  # import from collections.abc
    "BLE001", # blind except Exception
    "S110",   # try-except-pass without logging
    "DTZ001", # datetime.now() without tz
    "DTZ003", # datetime.utcnow() deprecated
    "TRY002", # custom exception class
    "B017",   # pytest.raises(Exception)
    "B008",   # function call in default argument
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
